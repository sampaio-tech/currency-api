name: Deploy Currency Names (i18n)

on:
  workflow_dispatch:   # Manual trigger only

jobs:
  deploy:
    name: Publish currency name translations to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dist
        run: |
          mkdir -p dist/v1/currencies/names
          cp data/currency-names/*.json dist/v1/currencies/names/

      - name: Deploy to Cloudflare Pages (latest)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: >
            pages deploy dist/
            --project-name=currency-api
            --branch=latest
