name: Deploy Currency Symbols

on:
  workflow_dispatch:   # Manual trigger only

jobs:
  deploy:
    name: Publish symbols to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dist
        run: |
          mkdir -p dist/v1/currencies
          cp data/currency-symbols/currency_symbols.json dist/v1/currencies/symbols.json

      - name: Deploy to Cloudflare Pages (latest)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: >
            pages deploy dist/
            --project-name=currency-api
            --branch=latest
