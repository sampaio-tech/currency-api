name: Sub-daily Rate Fetch & Deploy

on:
  schedule:
    - cron: "0 * * * *"   # Every hour — edit this expression to change frequency

env:
  RUST_LOG: fetcher=info
  CARGO_TERM_COLOR: always

jobs:
  fetch-and-deploy:
    name: Fetch rates and deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------ #
      # 1. Source                                                            #
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. Rust toolchain                                                   #
      # ------------------------------------------------------------------ #
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ------------------------------------------------------------------ #
      # 3. Build                                                            #
      # ------------------------------------------------------------------ #
      - name: Build release binary
        run: cargo build --release --bin fetcher

      # ------------------------------------------------------------------ #
      # 4. Fetch rates                                                      #
      # ------------------------------------------------------------------ #
      - name: Get snapshot datetime
        id: snapshot
        run: |
          echo "date=$(date -u '+%Y-%m-%d')"         >> "$GITHUB_OUTPUT"
          echo "iso=$(date -u '+%Y-%m-%dT%H:%M')"    >> "$GITHUB_OUTPUT"
          echo "branch=$(date -u '+%Y-%m-%dt%H-%M')" >> "$GITHUB_OUTPUT"

      - name: Fetch exchange rates and generate static files
        env:
          FIAT_API_URL:   ${{ secrets.FIAT_API_URL }}
          FIAT_API_KEY:   ${{ secrets.FIAT_API_KEY }}
          CRYPTO_API_URL: ${{ secrets.CRYPTO_API_URL }}
          CRYPTO_API_KEY: ${{ secrets.CRYPTO_API_KEY }}
        run: ./target/release/fetcher --output dist/ --date "${{ steps.snapshot.outputs.iso }}"

      # ------------------------------------------------------------------ #
      # 5. Bundle static data (flags, names, symbols) into dist/           #
      # These files live in data/ and do not change per run.               #
      # ------------------------------------------------------------------ #
      - name: Bundle static data into dist/
        run: |
          mkdir -p dist/v1/currencies/flags
          mkdir -p dist/v1/currencies/names
          cp data/currency-flags/*.svg dist/v1/currencies/flags/
          cp data/currency-names/*.json dist/v1/currencies/names/
          cp data/currency-symbols/currency_symbols.json dist/v1/currencies/symbols.json

      # ------------------------------------------------------------------ #
      # 6. Deploy — "latest" branch                                         #
      # ------------------------------------------------------------------ #
      - name: Deploy to Cloudflare Pages (latest)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: >
            pages deploy dist/
            --project-name=currency-api
            --branch=latest

      # ------------------------------------------------------------------ #
      # 7. Deploy — date-specific branch  (e.g. 2026-03-07)                #
      # Cloudflare Pages maps branch names to subdomains automatically:    #
      #   2026-03-07.currency-api.pages.dev                                #
      # ------------------------------------------------------------------ #
      - name: Deploy to Cloudflare Pages (${{ steps.snapshot.outputs.date }})
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: >
            pages deploy dist/
            --project-name=currency-api
            --branch=${{ steps.snapshot.outputs.date }}

      # ------------------------------------------------------------------ #
      # 8. Deploy — timestamp-specific branch  (e.g. 2026-03-07t14-30)     #
      # ------------------------------------------------------------------ #
      - name: Deploy to Cloudflare Pages (${{ steps.snapshot.outputs.branch }})
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: >
            pages deploy dist/
            --project-name=currency-api
            --branch=${{ steps.snapshot.outputs.branch }}
